<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Banners · Constructora Santo Thomás</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Fuente de los banners. Uso: banners.html?estilo=foto|tipografia|loteo&w=1080&h=1080 */
:root{--cal:#ece8df;--tinta:#0d0d0c;--campo:#1f1f1c;--campo-osc:#0d0d0c;--oro:#c9a45c}
*{box-sizing:border-box;margin:0}
body{background:#888;font-family:Archivo,sans-serif}
#b{position:relative;overflow:hidden;container-type:size;color:var(--cal)}
#b .zona{position:absolute;inset:10cqh 7cqw;display:flex;flex-direction:column;justify-content:space-between} /* zona segura */
h1{font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:-.012em;line-height:.98;font-size:calc(var(--u)*15.5);max-width:12ch;text-wrap:balance}
.sub{font-size:max(16px,calc(var(--u)*3.4));line-height:1.35;font-weight:400;max-width:30ch;margin-top:calc(var(--u)*3)}
.fila{display:flex;align-items:flex-end;justify-content:space-between;gap:4cqw}
.marca{display:flex;align-items:center;gap:calc(var(--u)*2);font-family:'Cormorant Garamond',serif;font-weight:500;font-size:max(16px,calc(var(--u)*3.6));letter-spacing:.2em;text-transform:uppercase}
.marca img{height:calc(var(--u)*9);width:auto}
.cta{background:var(--oro);color:var(--tinta);font-weight:600;letter-spacing:.08em;font-size:max(16px,calc(var(--u)*3.2));min-height:44px;padding:calc(var(--u)*2.4) calc(var(--u)*4);display:flex;align-items:center;white-space:nowrap}
/* A · Foto */
.foto{background:var(--tinta)}
.foto .img{position:absolute;inset:0;background:url(../img/aerea-loteo.webp) 50% 55%/cover}
.foto .velo{position:absolute;inset:0;background:rgba(13,13,12,.66)}
/* B · Tipografía */
.tipografia{background:var(--tinta)}
.tipografia h1{font-size:calc(var(--u)*20);max-width:11ch}
.tipografia .bloque{position:absolute;right:0;top:0;bottom:0;width:calc(var(--u)*1.2);background:var(--oro)}
/* C · Loteo */
.loteo{background:var(--campo-osc)}
.loteo canvas{position:absolute;inset:0;width:100%;height:100%}
.loteo .panel{position:absolute;left:0;top:0;bottom:0;width:var(--panel);background:var(--campo-osc)}
.loteo.alto .panel{width:100%;height:56%;bottom:auto}
.loteo.alto .marca{background:var(--campo-osc);padding:calc(var(--u)*2) calc(var(--u)*3);margin-left:calc(var(--u)*-3)}
.loteo .cta{outline:calc(var(--u)*1.2) solid var(--campo-osc)}
.loteo h1,.loteo .sub{max-width:11ch}.loteo .sub{max-width:22ch}
.ancho h1,.tipografia.ancho h1{max-width:16ch;font-size:calc(var(--u)*12.5)}
.ancho .sub{margin-top:calc(var(--u)*1.5)}
</style>
</head>
<body>
<div id="b">
  <div class="img"></div><div class="velo"></div><canvas id="c"></canvas><div class="panel"></div><div class="bloque"></div>
  <div class="zona">
    <div>
      <h1>Lotes y casas en Pitalito</h1>
      <p class="sub">Constructora Santo Thomás. Urbanizamos y construimos en el Huila desde 2014.</p>
    </div>
    <div class="fila">
      <div class="marca"><img src="../img/isotipo-claro.png" alt="">Santo Thomás</div>
      <div class="cta">Escríbenos: 317 646 1480</div>
    </div>
  </div>
</div>
<script src="../arte/loteo-core.js"></script>
<script>
var q = new URLSearchParams(location.search), w = +q.get('w') || 1080, h = +q.get('h') || 1080, e = q.get('estilo') || 'foto';
var b = document.getElementById('b'), razon = w / h;
b.style.width = w + 'px'; b.style.height = h + 'px';
b.className = e + (razon > 2 ? ' ancho' : razon < 1.2 ? ' alto' : '');
// Unidad tipográfica: se apoya en el lado que limita la composición.
b.style.setProperty('--u', (razon > 2 ? h / 100 * 1.25 : razon > 1.2 ? h / 100 * 0.92 : w / 100 * 0.78) + 'px');
b.style.setProperty('--panel', razon > 2 ? '46%' : '52%');
['img', 'velo'].forEach(function (c) { if (e !== 'foto') b.querySelector('.' + c).remove(); });
if (e !== 'tipografia') b.querySelector('.bloque').remove();
if (e !== 'loteo') { b.querySelector('#c').remove(); b.querySelector('.panel').remove(); }
else {
  var c = document.getElementById('c'); c.width = w * 2; c.height = h * 2;
  var plan = Loteo.generate(+q.get('semilla') || 2014, c.width, c.height, { construido: 0.4 });
  Loteo.draw(c.getContext('2d'), plan, 1, Object.assign({}, Loteo.STYLE, { casa: '#c9a45c' }), null, true);
}
</script>
</body>
</html>
